<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: "~/research/writeups" }}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
   <style>
    :root {
        --bg-color: #000000; /* Solid Black Background */
        --surface-color: #111111; /* Slightly lighter surface */
        --text-primary: #e5e7eb;
        --text-secondary: #9ca3af;
        --accent: #ff2a2a; /* Neon Red */
        --accent-glow: rgba(255, 42, 42, 0.15);
        --border: #3d1414; /* Dark red border */
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        padding: 0 20px;
        overflow-x: hidden;
    }

    .container {
        max-width: 950px; /* Increased to accommodate columns */
        margin: 0 auto;
        padding: 50px 0;
    }

    /* --- Navigation --- */
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px dashed var(--border);
        margin-bottom: 60px;
    }

    .logo {
        font-weight: 700;
        color: var(--accent);
        text-decoration: none;
        font-size: 1.2rem;
        text-shadow: 0 0 10px var(--accent-glow);
        letter-spacing: -1px;
    }

    .nav-links a {
        color: var(--text-secondary);
        text-decoration: none;
        margin-left: 25px;
        font-size: 0.9rem;
        transition: color 0.2s ease;
    }

    .nav-links a:hover {
        color: var(--accent);
    }

    /* --- Hero Section --- */
    .hero {
        margin-bottom: 80px;
    }

    .hero p {
        color: var(--text-secondary);
        margin-top: 20px;
        max-width: 600px;
        font-size: 1.1rem;
    }

    /* --- Sections --- */
    h2 {
        font-size: 1.3rem;
        margin-bottom: 25px;
        color: var(--text-primary);
    }

    /* --- Grid & Cards (Shrunk) --- */
    .grid {
        display: grid;
        /* Switched from 1fr to a multi-column responsive grid */
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 15px; /* Tighter gap */
        margin-bottom: 60px;
    }

    .card {
        background-color: var(--surface-color);
        border: 1px solid var(--border);
        border-radius: 4px; /* Sharper corners for compact look */
        padding: 15px; /* Reduced from 25px */
        text-decoration: none;
        display: block;
        transition: all 0.3s ease;
    }

    .card:hover {
        transform: translateY(-2px); /* Subtle hover lift */
        border-color: var(--accent);
        box-shadow: 0 4px 15px var(--accent-glow);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px; /* Tighter spacing */
    }

    .badge {
        background-color: rgba(255, 42, 42, 0.1);
        color: var(--accent);
        padding: 2px 8px; /* Reduced padding */
        border-radius: 2px;
        font-size: 0.7rem; /* Reduced from 0.75rem */
        border: 1px solid rgba(255, 42, 42, 0.2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .date {
        color: var(--text-secondary);
        font-size: 0.75rem; /* Reduced from 0.85rem */
    }

    .card h3 {
        margin-bottom: 5px; /* Tighter spacing */
        color: var(--text-primary);
        font-size: 1.0rem; /* Reduced from 1.2rem */
    }

    .card p {
        color: var(--text-secondary);
        font-size: 0.8rem; /* Reduced from 0.95rem */
        line-height: 1.4; /* Compressed line height */
    }

    /* --- Advanced Cyber Glitch --- */
    .glitch {
        position: relative;
        display: inline-block;
    }

    .glitch::before,
    .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000; /* Solid background is required */
    }

    /* Red shifted layer */
    .glitch::before {
        left: 2px;
        text-shadow: -2px 0 #ff2a2a;
        animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }

    /* Cyan shifted layer */
    .glitch::after {
        left: -2px;
        text-shadow: 2px 0 #0ff;
        animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    /* Rapid masking animation 1 */
    @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        10% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        20% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        30% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
        40% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
        50% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
        60% { clip-path: inset(70% 0 20% 0); transform: translate(-2px, -1px); }
        70% { clip-path: inset(50% 0 30% 0); transform: translate(2px, 1px); }
        80% { clip-path: inset(15% 0 80% 0); transform: translate(-2px, -2px); }
        90% { clip-path: inset(90% 0 5% 0); transform: translate(2px, 2px); }
        100% { clip-path: inset(35% 0 45% 0); transform: translate(-2px, -1px); }
    }

    /* Rapid masking animation 2 (offset timing) */
    @keyframes glitch-anim-2 {
        0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
        10% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
        20% { clip-path: inset(30% 0 50% 0); transform: translate(2px, 1px); }
        30% { clip-path: inset(50% 0 20% 0); transform: translate(-2px, -2px); }
        40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); }
        50% { clip-path: inset(20% 0 70% 0); transform: translate(-2px, 1px); }
        60% { clip-path: inset(90% 0 5% 0); transform: translate(2px, -1px); }
        70% { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 2px); }
        80% { clip-path: inset(5% 0 85% 0); transform: translate(2px, -2px); }
        90% { clip-path: inset(60% 0 30% 0); transform: translate(-2px, 1px); }
        100% { clip-path: inset(25% 0 55% 0); transform: translate(2px, 2px); }
    }

    /* Code Block Styling (Kept from earlier turns) */
    pre { background-color: #05080f; border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 15px; border-radius: 6px; overflow-x: auto; margin: 20px 0; }
    code { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: #e5e7eb; }
    
    /* Syntax Highlighting CSS (Kept from earlier turns) */
    .highlight { color: #e5e7eb; }
    .highlight .c, .highlight .cm, .highlight .c1 { color: #6b7280; font-style: italic; }
    .highlight .k, .highlight .kd, .highlight .kn { color: #ff2a2a; font-weight: bold; }
    .highlight .s, .highlight .s1, .highlight .s2 { color: #fcd34d; }
    .highlight .m, .highlight .mi, .highlight .mf { color: #c084fc; }
    .highlight .nf, .highlight .fm { color: #34d399; }
    .highlight .nb, .highlight .bp { color: #60a5fa; }
    .highlight .nc, .highlight .nn { color: #fb923c; }
    .highlight .o, .highlight .p { color: #e5e7eb; }

    /* Footer */
    footer { text-align: center; padding: 40px 0; color: var(--text-secondary); border-top: 1px dashed var(--border); font-size: 0.85rem; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
        <nav>
            <!-- Intense pseudo-element glitch applied to the logo link -->
            <a href="/" class="logo glitch" data-text="Challenge write-ups">Challenge write-ups</a>
            <div class="nav-links">
                <a href="/#ctf">CTF</a>
                <a href="/archive.html">Archive</a>
                <a href="https://github.com/yourusername" target="_blank">GitHub</a>
            </div>
        </nav>

    {{ content }}

    <footer>
        <p>Hosted on <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </footer>
</div>
</body>
</html>
