<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: "~/research/writeups" }}</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --bg-color: #0a0505; /* Deep dark red-black */
            --surface-color: #140505; /* Slightly lighter red-black */
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent: #ff2a2a; /* Neon Red */
            --accent-glow: rgba(255, 42, 42, 0.15);
            --border: #3d1414; /* Dark red border */
        }
        
        /* Scroll down and update the prompt color too */
        .prompt::before {
            content: "guest@system:~# ";
            color: #9ca3af; /* Changes the blue prompt to a sleek grey */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000000;
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0 20px;
            overflow-x: hidden;
        }
        .container { max-width: 850px; margin: 0 auto; padding: 50px 0; }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px dashed var(--border); margin-bottom: 60px;
        }
        .logo { font-weight: 700; color: var(--accent); text-decoration: none; font-size: 1.2rem; text-shadow: 0 0 10px var(--accent-glow); }
        .nav-links a { color: var(--text-secondary); text-decoration: none; margin-left: 25px; font-size: 0.9rem; transition: color 0.2s ease; }
        .nav-links a:hover { color: var(--accent); }
        
        /* Add hero classes from index for fallback */
        .hero { margin-bottom: 80px; }
        .prompt { color: var(--text-secondary); margin-bottom: 10px; font-size: 1.1rem; }
        .prompt::before { content: "achilla "; color: #60a5fa; }
        .typewriter {
            color: var(--accent); display: inline-block; overflow: hidden; white-space: nowrap;
            border-right: 2px solid var(--accent);
            animation: typing 2.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        @keyframes typing { from { max-width: 0 } to { max-width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--accent); } }
        .hero p { color: var(--text-secondary); margin-top: 20px; max-width: 600px; }
        h2 { font-size: 1.3rem; margin-bottom: 25px; color: var(--text-primary); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 60px; }
        .card {
            background-color: var(--surface-color); border: 1px solid var(--border);
            border-radius: 8px; padding: 25px; text-decoration: none; display: block; transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 25px var(--accent-glow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge {
            background-color: rgba(0, 255, 157, 0.1); color: var(--accent); padding: 4px 10px;
            border-radius: 4px; font-size: 0.75rem; border: 1px solid rgba(0, 255, 157, 0.2); text-transform: uppercase;
        }
        .date { color: var(--text-secondary); font-size: 0.85rem; }
        .card h3 { margin-bottom: 10px; color: var(--text-primary); font-size: 1.2rem; }
        .card p { color: var(--text-secondary); font-size: 0.95rem; }
        footer { text-align: center; padding: 40px 0; color: var(--text-secondary); border-top: 1px dashed var(--border); font-size: 0.85rem; }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        /* Code Block Styling */
        pre {
            background-color: #05080f; 
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 20px 0;
        }
        
        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #e5e7eb;
        }
        
        /* Inline code styling (e.g. `like this`) */
        p > code {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
            color: var(--accent);
        }
        /* --- Syntax Highlighting (Rouge) --- */
        .highlight { color: #e5e7eb; }
        .highlight .c, .highlight .cm, .highlight .c1 { color: #6b7280; font-style: italic; } /* Comments (Grey) */
        .highlight .k, .highlight .kd, .highlight .kn { color: #ff2a2a; font-weight: bold; } /* Keywords (Theme Red) */
        .highlight .s, .highlight .s1, .highlight .s2 { color: #fcd34d; } /* Strings (Yellow) */
        .highlight .m, .highlight .mi, .highlight .mf { color: #c084fc; } /* Numbers (Purple) */
        .highlight .nf, .highlight .fm { color: #34d399; } /* Functions (Green) */
        .highlight .nb, .highlight .bp { color: #60a5fa; } /* Built-ins (Blue) */
        .highlight .nc, .highlight .nn { color: #fb923c; } /* Classes/Namespaces (Orange) */
        .highlight .o, .highlight .p { color: #e5e7eb; } /* Operators/Punctuation (White) */
/* --- Advanced Cyberpunk Glitch --- */
        .glitch {
            position: relative;
            display: inline-block;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000; /* Must match your background color */
        }
        
        /* Red shifted layer */
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff2a2a;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }
        
        /* Cyan shifted layer */
        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 #0ff;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        
        /* Animation for the first layer */
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            10% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            30% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
            50% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(70% 0 20% 0); transform: translate(-2px, -1px); }
            70% { clip-path: inset(50% 0 30% 0); transform: translate(2px, 1px); }
            80% { clip-path: inset(15% 0 80% 0); transform: translate(-2px, -2px); }
            90% { clip-path: inset(90% 0 5% 0); transform: translate(2px, 2px); }
            100% { clip-path: inset(35% 0 45% 0); transform: translate(-2px, -1px); }
        }
        
        /* Animation for the second layer (offset timing) */
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            10% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(30% 0 50% 0); transform: translate(2px, 1px); }
            30% { clip-path: inset(50% 0 20% 0); transform: translate(-2px, -2px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); }
            50% { clip-path: inset(20% 0 70% 0); transform: translate(-2px, 1px); }
            60% { clip-path: inset(90% 0 5% 0); transform: translate(2px, -1px); }
            70% { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 2px); }
            80% { clip-path: inset(5% 0 85% 0); transform: translate(2px, -2px); }
            90% { clip-path: inset(60% 0 30% 0); transform: translate(-2px, 1px); }
            100% { clip-path: inset(25% 0 55% 0); transform: translate(2px, 2px); }
        }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <a href="/" class="logo glitch">Challenge write-ups</a>
        <div class="nav-links">
            <a href="/#ctf">CTF</a>
            <a href="/archive.html">Archive</a> <!-- Add this line -->
            <a href="https://github.com/AchillaMan" target="_blank">GitHub</a>
        </div>
    </nav>

    {{ content }}

    <footer>
        <p>Hosted on <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </footer>
</div>
</body>
</html>
